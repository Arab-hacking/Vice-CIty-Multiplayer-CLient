name: Build (Windows x64)

on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    name: Windows x64 (MSVC, Release)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake, Visual Studio 17 2022, x64)
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022" -A x64
          -DVC_BUILD_TESTS=ON

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Run unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Get-ChildItem build -Recurse -Include vc-client.dll,vc-launcher.exe,vc-server.exe,vc-netprobe.exe,vc-bot.exe |
            Copy-Item -Destination artifacts -Force
          Copy-Item tools/netprobe/servers.example.txt artifacts -Force
          Get-ChildItem artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vc-multiplayer-windows-x64
          path: artifacts/
          if-no-files-found: error

  build-linux-server:
    name: Linux server + tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DVC_BUILD_CLIENT=OFF -DVC_BUILD_LAUNCHER=OFF
          -DVC_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Integration smoke test (server + netprobe)
        shell: bash
        run: |
          set -x
          SRV_BIN="$(find build -type f -name vc-server | head -n1)"
          PROBE_BIN="$(find build -type f -name vc-netprobe | head -n1)"
          test -n "$SRV_BIN" && test -n "$PROBE_BIN"
          "$SRV_BIN" --port 7777 > server.log 2>&1 &
          SRV=$!
          sleep 1
          ss -lunp 2>/dev/null | grep 7777 || true
          "$PROBE_BIN" 127.0.0.1 7777 --timeout-ms 3000 > probe.txt 2>&1 || true
          BOT_BIN="$(find build -type f -name vc-bot | head -n1)"
          "$BOT_BIN" --port 7777 --nick CIBot --seconds 3 > bot.txt 2>&1 || true
          kill $SRV || true
          cat probe.txt bot.txt
          if ! grep -q "raknet-ping.*pong" probe.txt || ! grep -q "samp-query\]" probe.txt || ! grep -q "ПОДКЛЮЧЕНО" bot.txt; then
            while IFS= read -r line; do echo "::error::PROBE: $line"; done < probe.txt
            while IFS= read -r line; do echo "::error::BOT: $line"; done < bot.txt
            while IFS= read -r line; do echo "::error::SERVER: $line"; done < server.log
            exit 1
          fi
