name: Build (Windows x64)

on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    name: Windows x64 (MSVC, Release)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake, Visual Studio 17 2022, x64)
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022" -A x64
          -DVC_BUILD_TESTS=ON

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Run unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Get-ChildItem build -Recurse -Include vc-client.dll,vc-launcher.exe,vc-server.exe,vc-netprobe.exe |
            Copy-Item -Destination artifacts -Force
          Copy-Item tools/netprobe/servers.example.txt artifacts -Force
          Get-ChildItem artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vc-multiplayer-windows-x64
          path: artifacts/
          if-no-files-found: error

  build-linux-server:
    name: Linux server + tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DVC_BUILD_CLIENT=OFF -DVC_BUILD_LAUNCHER=OFF
          -DVC_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Integration smoke test (server + netprobe)
        shell: bash
        run: |
          ./build/server/vc-server --port 7777 &
          SRV=$!
          sleep 1
          ./build/tools/netprobe/vc-netprobe 127.0.0.1 7777 --timeout-ms 2000 | tee probe.txt
          kill $SRV || true
          grep -q "raknet-ping.*pong" probe.txt
          grep -q "samp-query" probe.txt
